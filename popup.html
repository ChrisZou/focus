<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus - 专注助手</title>
  <link rel="stylesheet" href="styles.css">
  <style>
body{width:360px;padding:22px 22px 18px}
.top{display:flex;justify-content:space-between;align-items:baseline}
.top b{font-size:1.05rem;font-weight:900}.top span{font-size:.75rem;color:var(--faint)}
.hero{margin:26px 0 4px;display:flex;align-items:flex-end;gap:12px}
.hero .num{font-size:5rem}.hero p{margin:0 0 8px;font-size:.95rem;line-height:1.35;color:var(--muted)}
.state{font-size:1rem;font-weight:700;margin:18px 0 0}.state i{font-style:normal;display:inline-block;width:10px;height:10px;background:var(--ok);margin-right:8px}
.h3{font-size:.8rem;font-weight:700;color:var(--muted);margin:24px 0 6px}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--rule);font-size:.95rem}
.row b{font-weight:800}.row b.x{color:var(--accent-ink)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;font-size:.9rem}

.top h1{margin:0;font-size:1.05rem;font-weight:900}
  </style>
</head>
<body>
  <header class="top"><h1>Focus 专注助手</h1><span id="version"></span></header>
  <div class="hero"><div class="num" id="todayCount">0</div><p>次干扰<br>今日已被阻止</p></div>
  <div class="state"><i aria-hidden="true"></i><span id="statusText">正在保持专注</span></div>
  <div id="dailyLimits" hidden></div>
  <div class="foot"><span class="faint">保持专注，提升效率</span><button class="lk" id="settingsBtn">打开设置<svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M2 8h11M9 3.5 13.5 8 9 12.5"/></svg></button></div>
  <script src="popup.js"></script>
</body>
</html>
