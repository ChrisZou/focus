<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus - 确认访问</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: white;
      color: #2c3e50;
      line-height: 1.6;
    }

    h1 {
      margin-bottom: 1rem;
      color: #2c3e50;
      font-size: 2.5rem;
      text-align: center;
    }

    .site {
      color: #7f8c8d;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .stat-item {
      background: #f8f9fa;
      padding: 1.5rem 3rem;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 2rem;
    }

    .number {
      font-size: 2.5rem;
      font-weight: bold;
      color: #3498db;
      margin-bottom: 0.5rem;
    }

    .label {
      color: #7f8c8d;
      font-size: 0.9rem;
    }

    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 0.8rem 2.5rem;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    button:hover {
      background: #2980b9;
    }

    button:disabled {
      background: #bdc3c7;
      cursor: default;
    }

    .error {
      display: none;
      color: #e67e22;
      margin-top: 1rem;
    }
  </style>
</head>

<body>
  <h1 id="remainingText">今天还剩 0 次</h1>
  <div class="site" id="siteName"></div>
  <div class="stat-item">
    <div class="number" id="usedCount">0 / 0</div>
    <div class="label">今日已访问次数 / 每日限额</div>
  </div>
  <button id="confirmBtn">确认进入</button>
  <div class="error" id="errorText"></div>

  <script src="confirm.js"></script>
</body>

</html>
