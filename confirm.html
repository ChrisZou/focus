<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus - 确认访问</title>
  <style>
    :root {
      --bg: #f1efe9;
      --ink: #161513;
      --muted: #5c5a54;
      --accent: #d6411e;
      --ok: #1f7a4a;
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 9rem 6rem 4.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 3rem;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
    }

    ::selection { background: #f3c3b5; }

    h1 {
      margin: 0;
      max-width: 14em;
      font-size: clamp(2.5rem, 5.4vw, 4.25rem);
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -0.03em;
      text-wrap: balance;
      overflow-wrap: anywhere;
    }

    .low {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 3rem;
      align-items: end;
    }

    .prompt {
      margin: 0 0 0.75rem;
      font-size: 1.25rem;
      color: var(--muted);
    }

    .phrase {
      color: var(--ink);
      font-weight: 700;
      user-select: none;
      -webkit-user-select: none;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.5rem 0;
      border: 0;
      border-bottom: 3px solid var(--ink);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 1.75rem;
      font-weight: 500;
      caret-color: var(--accent);
      outline: none;
    }

    input:focus-visible { border-bottom-color: var(--accent); }
    .ok input { border-bottom-color: var(--ok); }

    .msg {
      min-height: 1.5rem;
      margin-top: 0.6rem;
      font-size: 1rem;
      color: var(--muted);
    }

    .ok .msg { color: var(--ok); }
    .msg.warn { color: var(--accent); }

    .count {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .count big {
      display: block;
      font-size: 4.25rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .count small {
      font-size: 1rem;
      color: var(--muted);
    }

    button {
      margin-top: 1.5rem;
      padding: 1rem 2.5rem;
      border: 0;
      border-radius: 0;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 1.125rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    button:hover:not(:disabled) { background: #b8361a; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    button:disabled { background: #d9d5cb; color: #8d897f; cursor: not-allowed; }

    .error {
      display: none;
      margin-top: 0.75rem;
      color: var(--accent);
    }
  </style>
</head>

<body>
  <h1 id="headline">你确定、一定以及肯定，现在就要访问这个网站吗？</h1>
  <div class="low">
    <div>
      <p class="prompt">想好了，就一字不差打出：<span class="phrase" id="phrase"></span></p>
      <input id="phraseInput" type="text" autocomplete="off" spellcheck="false" aria-labelledby="phrase" aria-describedby="msg">
      <div class="msg" id="msg" aria-live="polite"></div>
    </div>
    <div class="count">
      <big id="remainingText">0 次</big>
      <small id="usedText">今天还剩 · 已用 0 / 0</small><br>
      <button id="confirmBtn" disabled>确认进入</button>
      <div class="error" id="errorText"></div>
    </div>
  </div>

  <script src="confirm.js"></script>
</body>

</html>
