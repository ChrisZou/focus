<?xml version="1.0" encoding="UTF-8"?>
<svg width="440" height="280" viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="440" height="280" fill="#f5f7fa"/>
  <path d="M0 0 L440 0 L440 280 L0 280 Z" fill="url(#gradient)"/>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c3cfe2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo -->
  <g transform="translate(50,90) scale(0.8)">
    <circle cx="64" cy="64" r="60" fill="#3498db"/>
    <circle cx="64" cy="64" r="54" fill="white" stroke="#2980b9" stroke-width="2"/>
    <circle cx="64" cy="64" r="4" fill="#2c3e50"/>
    <line x1="64" y1="64" x2="64" y2="40" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
    <line x1="64" y1="64" x2="85" y2="64" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
    <circle cx="64" cy="30" r="8" fill="#e74c3c"/>
  </g>

  <!-- 文字 -->
  <text x="180" y="100" font-family="'Helvetica Neue', Arial" font-size="36" font-weight="bold" fill="#2c3e50">Focus 专注助手</text>
  <text x="180" y="140" font-family="'Helvetica Neue', Arial" font-size="20" fill="#34495e">远离干扰，保持专注</text>
  <text x="180" y="180" font-family="'Helvetica Neue', Arial" font-size="16" fill="#7f8c8d">• 智能阻止社交媒体</text>
  <text x="180" y="210" font-family="'Helvetica Neue', Arial" font-size="16" fill="#7f8c8d">• 实时统计节省时间</text>
</svg> 