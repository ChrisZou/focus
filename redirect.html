<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus - 保持专注</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: white;
      color: #2c3e50;
      line-height: 1.6;
    }

    h1 {
      margin-bottom: 1rem;
      color: #2c3e50;
      font-size: 3rem;
      max-width: 800px;
      text-align: center;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    #sourceAvatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1.5rem;
      display: none;
    }

    .message-source {
      display: none;
      margin-bottom: 2rem;
      color: #7f8c8d;
      font-size: 1.1rem;
    }

    .message-source.show {
      display: block;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2rem;
      margin: 2rem 0;
      width: 100%;
      max-width: 600px;
    }

    .stat-item {
      background: #f8f9fa;
      padding: 1.5rem;
      border-radius: 15px;
      text-align: center;
    }

    .number {
      font-size: 2.5rem;
      font-weight: bold;
      color: #3498db;
      margin-bottom: 0.5rem;
    }

    .label {
      color: #7f8c8d;
      font-size: 0.9rem;
    }

    .site {
      color: #95a5a6;
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }
  </style>
</head>

<body>
  <img id="sourceAvatar" alt="">
  <h1>保持专注</h1>
  <div class="message-source" id="messageSource">
    <span id="sourceName"></span>
  </div>
  <div class="stats">
    <div class="stat-item">
      <div class="number" id="todayCount">0</div>
      <div class="label">今日已阻止访问次数</div>
      <div class="site" id="siteName"></div>
    </div>
    <div class="stat-item">
      <div class="number" id="savedTime">0</div>
      <div class="label">已节省时间（小时）</div>
    </div>
  </div>

  <script src="redirect.js"></script>
</body>

</html>
